[package]
name = "btd6-save-state-manager"
version = "0.1.0"
description = "Named snapshots of Bloons TD 6 save data, restorable later."
authors = ["Thomas"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "btd6_save_state_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sysinfo = "0.33"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
winreg = "0.55"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
